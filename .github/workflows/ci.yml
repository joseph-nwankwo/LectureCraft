name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Backend Lint & Type Check ─────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Prisma generate
        run: npx prisma generate

  # ── Frontend Lint & Type Check ────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        run: npx oxlint .

  # ── Backend Unit Tests ────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: craftsuite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/craftsuite_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars-long!!
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars-long!
      COOKIE_SECRET: test-cookie-secret-at-least-32-chars-long!!!!!!
      CRAFT_LAUNCH_SECRET: test-craft-launch-secret-min-32-chars-long!
      CENTRAL_ENTITLEMENT_URL: http://localhost:9999/api/internal/entitlements/verify
      CENTRAL_ENTITLEMENT_SERVICE_SECRET: test-entitlement-svc-secret-min-32-chars!!
      FRONTEND_URL: http://localhost:3001
      PORT: 4000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: backend/coverage
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Frontend Build Test ───────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.lecturesuite.app/api
          VITE_APP_NAME: LectureSuite

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/dist
          retention-days: 1

  # ── Security Audit ────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # ── Backend Docker Image Verification ────────────────────────────────────────
  docker-verify:
    name: Backend — Docker Image Verification
    runs-on: ubuntu-latest
    needs: backend-lint
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: lecturesuite-backend:ci-verify

      - name: Verify Chromium executable exists
        run: docker run --rm lecturesuite-backend:ci-verify which chromium-browser

      - name: Print Chromium version
        run: docker run --rm lecturesuite-backend:ci-verify /usr/bin/chromium-browser --version

      - name: Verify runtime user is appuser
        run: test "$(docker run --rm --user appuser lecturesuite-backend:ci-verify whoami)" = "appuser"

      - name: Verify Chromium launches headlessly as appuser
        run: |
          docker run --rm --user appuser lecturesuite-backend:ci-verify \
            /usr/bin/chromium-browser \
            --headless --no-sandbox --disable-setuid-sandbox \
            --dump-dom about:blank > /dev/null 2>&1
          echo "PASS: Chromium launched and exited cleanly"

      - name: generatePDF() smoke test
        run: |
          docker run --rm --user appuser lecturesuite-backend:ci-verify node -e "
          const { generatePDF } = require('./dist/services/document/pdf.service');
          generatePDF('<html><body><h1>OPS-02 smoke</h1></body></html>')
            .then(buf => {
              if (!Buffer.isBuffer(buf)) {
                console.error('FAIL: result is not a Buffer');
                process.exit(1);
              }
              if (buf.length <= 5) {
                console.error('FAIL: buffer too short: ' + buf.length);
                process.exit(1);
              }
              const sig = buf.subarray(0, 5).toString('ascii');
              if (sig !== '%PDF-') {
                console.error('FAIL: unexpected PDF signature: ' + sig);
                process.exit(1);
              }
              console.log('PASS: PDF generated, bytes=' + buf.length);
            })
            .catch(err => {
              console.error('FAIL:', err.message);
              process.exit(1);
            });
          "
