apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lecturecraft-ingress
  namespace: lecturecraft
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WebSocket / SSE
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rpm: "300"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # Cert-manager TLS
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    # Legacy domain — keep active during migration
    - hosts:
        - lecturecraft.app
        - www.lecturecraft.app
        - api.lecturecraft.app
      secretName: lecturecraft-tls
    # New domain — uncomment once DNS points to this cluster.
    # cert-manager will automatically provision lecturesuite-tls via letsencrypt-prod.
    # PENDING: DNS A records for lecturesuite.app, www.lecturesuite.app, api.lecturesuite.app
    # - hosts:
    #     - lecturesuite.app
    #     - www.lecturesuite.app
    #     - api.lecturesuite.app
    #   secretName: lecturesuite-tls
  rules:
    # Legacy API traffic
    - host: api.lecturecraft.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
    # New API domain — uncomment after DNS and TLS are confirmed
    # - host: api.lecturesuite.app
    #   http:
    #     paths:
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: backend-service
    #             port:
    #               number: 4000
    # Legacy frontend + API on same domain
    - host: lecturecraft.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    # New frontend domain — uncomment after DNS and TLS are confirmed
    # - host: lecturesuite.app
    #   http:
    #     paths:
    #       - path: /api
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: backend-service
    #             port:
    #               number: 4000
    #       - path: /socket.io
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: backend-service
    #             port:
    #               number: 4000
    #       - path: /health
    #         pathType: Exact
    #         backend:
    #           service:
    #             name: backend-service
    #             port:
    #               number: 4000
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: frontend-service
    #             port:
    #               number: 80
